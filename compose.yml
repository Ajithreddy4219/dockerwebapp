---
version: "3.9"

services:
 devopsdb:
   image: ajithreddy4219/automation:db
   ports:
     - "3306:3306"
   deploy:
     replicas: 3 
   networks:
    - mynetwork
    
 application:
   image: ajithreddy4219/automation:app
   ports:
     - "1111:8080"
   deploy:
     replicas: 3
   depends_on:
     - "devopsdb"
   network:
    - mynetwork

networks:
 mynetwork:
  driver: overlay
